<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pythonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3776ab;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffd43b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Python logo -->
  <g transform="translate(128, 50)">
    <circle cx="0" cy="-8" r="12" fill="#3776ab"/>
    <path d="M -8 0 Q -15 15 0 22 Q 15 15 8 0" fill="#ffd43b" stroke="#3776ab" stroke-width="1.5"/>
    <circle cx="-4" cy="-10" r="2" fill="white"/>
    <circle cx="4" cy="-10" r="2" fill="white"/>
  </g>
  
  <!-- Arrow down -->
  <g transform="translate(128, 110)">
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#3776ab" stroke-width="3" stroke-linecap="round"/>
    <path d="M -6 4 L 0 12 L 6 4" fill="none" stroke="#3776ab" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Monitor -->
  <g transform="translate(128, 180)">
    <rect x="-35" y="-20" width="70" height="45" rx="4" fill="none" stroke="#3776ab" stroke-width="2.5"/>
    <line x1="-30" y1="-12" x2="30" y2="-12" stroke="#ffd43b" stroke-width="2" stroke-linecap="round"/>
    <line x1="-30" y1="-4" x2="30" y2="-4" stroke="#ffd43b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-30" y1="4" x2="20" y2="4" stroke="#ffd43b" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="-8" y="25" width="16" height="8" fill="#3776ab" rx="2"/>
    <rect x="-20" y="33" width="40" height="4" fill="#3776ab" rx="1"/>
  </g>
</svg>
